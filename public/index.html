<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#091c22">
  <meta name="description" content="A workspace for understanding signed supplier agreements.">
  <title>Contract Desk</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="views.css">
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="story.css">
  <link rel="stylesheet" href="architecture.css">
  <link rel="stylesheet" href="app.css">
  <script src="legacy-demo-sources.js" defer></script>
  <script src="fixtures.js" defer></script>
  <script src="board.js" defer></script>
  <script src="story.js" defer></script>
  <script src="architecture.js" defer></script>
  <script src="views.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#overview" aria-label="Contract Desk home">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M4 11.1 16 4l12 7.1v9.8L16 28 4 20.9v-9.8Z" stroke="currentColor" stroke-width="1.4"/>
            <path d="M4.2 11.3 16 18.2l11.8-6.9M16 18.2V28M10 7.6l12 7.1" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
          </svg>
        </span>
        <span class="brand-copy"><strong>Contract Desk</strong><span>INTELLIGENCE WORKSPACE</span></span>
      </a>

      <div class="sidebar-section-label">WORKSPACE</div>
      <nav class="primary-nav" aria-label="Workspace">
        <button class="nav-link is-active" type="button" data-view="overview" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M3.75 11.2 12 4l8.25 7.2v8.05a.75.75 0 0 1-.75.75h-5v-5.5h-5v5.5h-5a.75.75 0 0 1-.75-.75V11.2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Home</span>
        </button>
        <button class="nav-link" type="button" data-view="library">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.25 4.75h10.5a2 2 0 0 1 2 2v12.5H7.25a2 2 0 0 1-2-2V4.75Zm0 12.5a2 2 0 0 1 2-2h10.5M9 8.25h5.75M9 11.25h5.75" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.75 7.5h1.5v12.75H7.5" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Contracts Library</span>
        </button>
        <button class="nav-link" type="button" data-view="board">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="3.75" y="4.75" width="6.5" height="14.5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="13.75" y="4.75" width="6.5" height="9.5" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M6.5 8h1M6.5 11h1M16.5 8h1M16.5 11h1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Team Board</span>
        </button>
        <button class="nav-link" type="button" data-view="story">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5.5 4.75h9l4 4v10.5h-13V4.75Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M14.5 4.75v4h4M8.75 12h6.5M8.75 15h6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Rationale &amp; Insights</span>
        </button>
        <button class="nav-link" type="button" data-view="architecture">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8.5" y="3.5" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="3.5" y="15.5" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><rect x="13.5" y="15.5" width="7" height="5" rx="1" stroke="currentColor" stroke-width="1.5"/><path d="M12 8.5v3.5M7 15.5V12h10v3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Architecture</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <span class="sidebar-footer-mark" aria-hidden="true"></span>
        <div>
          <strong>Made for Procurement</strong>
          <span>Tyran</span>
        </div>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-context">
          <span class="topbar-eyebrow">CONTRACT WORKSPACE <span aria-hidden="true">/</span></span>
          <h1 id="page-title">Home</h1>
        </div>
        <div class="topbar-actions">
          <button class="button button-ghost top-ai" type="button" id="global-ai-button">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m12 3 1.65 5.35L19 10l-5.35 1.65L12 17l-1.65-5.35L5 10l5.35-1.65L12 3ZM18.5 15l.7 2.3 2.3.7-2.3.7-.7 2.3-.7-2.3-2.3-.7 2.3-.7.7-2.3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            <span>AskSirion</span>
          </button>
          <button class="button button-primary" type="button" id="add-contract">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
            <span>Add contract</span>
          </button>
          <button class="icon-button notification-trigger" type="button" id="reminders-button" aria-label="Open reminders" aria-haspopup="dialog" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M18 9.75a6 6 0 0 0-12 0v4.56l-1.34 2.44h14.68L18 14.31V9.75ZM10 19.25a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="profile-chip" aria-label="Procurement workspace">
            <span class="profile-avatar" aria-hidden="true">P</span>
            <span class="profile-name">Procurement</span>
          </div>
        </div>
      </header>

      <main id="view" class="view-container" aria-live="polite">
        <div class="initial-loading" role="status">Loading workspace…</div>
      </main>
    </div>
  </div>

  <div id="drawer-root"></div>
  <div id="popover-root"></div>
  <div id="toast-root" aria-live="polite"></div>
</body>
</html>
